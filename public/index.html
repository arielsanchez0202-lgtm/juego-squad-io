<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos - Tu Lectura Astral</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050510; color: #e0e0e0; font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at center, #1a1a3a 0%, #050510 100%); }
        .container { background: rgba(20, 20, 40, 0.8); padding: 30px; border-radius: 20px; box-shadow: 0 0 40px rgba(138, 43, 226, 0.2); width: 90%; max-width: 420px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; backdrop-filter: blur(10px); }
        h1 { color: #d4af37; font-size: 28px; font-weight: normal; letter-spacing: 3px; margin-bottom: 5px; }
        p.subtitle { color: #888; font-style: italic; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #d4af37; }
        button.btn-primary { width: 100%; padding: 15px; background: linear-gradient(45deg, #d4af37, #b8860b); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4); }
        button.btn-social { width: 100%; padding: 12px; background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button.btn-social:hover { opacity: 0.9; transform: scale(1.02); }
        #results { display: none; animation: fadeIn 1s ease-in; }
        #captureZone { background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%); padding: 20px; border-radius: 15px; border: 2px solid #d4af37; margin-bottom: 20px; position: relative; }
        .result-card { background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid #d4af37; text-align: left; }
        .result-card h3 { margin: 0 0 5px 0; color: #d4af37; font-size: 12px; text-transform: uppercase; }
        .result-card p { margin: 0; font-size: 14px; }
        .daily-message { font-style: italic; color: #fff; text-align: center; margin: 15px 0; font-size: 16px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .watermark { font-size: 10px; color: #888; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .loader { display: none; color: #d4af37; margin-top: 20px; font-style: italic; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container" id="mainCard">
    <div id="inputForm">
        <h1>COSMOS</h1>
        <p class="subtitle">Tu destino revelado en segundos</p>
        <div class="form-group">
            <label>¿Cuál es tu nombre?</label>
            <input type="text" id="nameInput" placeholder="Ej. Ariel" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Fecha de Nacimiento</label>
            <input type="date" id="dateInput">
        </div>
        <button class="btn-primary" onclick="generateReading()">Revelar mi Carta Astral</button>
        <div class="loader" id="loader">Consultando a los astros... 🌌</div>
    </div>

    <div id="results">
        <div id="captureZone">
            <h1 style="font-size: 22px;">CARTA ASTRAL</h1>
            <p class="subtitle" id="greetingName" style="color:#fff; margin-bottom: 15px;"></p>

            <div class="result-card">
                <h3>Signo y Luna</h3>
                <p><span id="zodiacRes"></span> | <span id="moonRes"></span></p>
            </div>

            <div class="result-card">
                <h3>Carta del Tarot del Día</h3>
                <p style="font-weight: bold; color: #b8860b;" id="tarotName"></p>
                <p style="font-size: 13px; color: #ccc; margin-top: 4px;" id="tarotMeaning"></p>
            </div>

            <div class="result-card">
                <h3>Vibra Musical</h3>
                <p id="musicRes" style="color: #00ffcc; font-weight: bold;"></p>
            </div>

            <div class="daily-message" id="dailyHoroscope"></div>
            <div class="watermark">Generado en Cosmos Astral</div>
        </div>

        <button class="btn-social" onclick="downloadImage()">📸 Descargar Foto para Historia</button>
        <button class="btn-primary" style="background: #222; border: 1px dashed #666; color: #aaa;" onclick="alert('Opción Premium Bloqueada.')">🔓 Desbloquear Lectura Profunda</button>
        <button class="btn-primary" style="margin-top: 15px; background: transparent; border: none; color: #888; font-size: 14px;" onclick="location.reload()">Hacer otra lectura</button>
    </div>
</div>

<script>
    async function generateReading() {
        const name = document.getElementById('nameInput').value;
        const dateStr = document.getElementById('dateInput').value;
        
        if (!name || !dateStr) { alert("Necesitamos tus datos para continuar."); return; }

        document.getElementById('loader').style.display = 'block';

        try {
            const response = await fetch('/api/leer-destino', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, dateStr })
            });
            
            const data = await response.json();

            document.getElementById('zodiacRes').innerText = data.zodiac;
            document.getElementById('moonRes').innerText = data.moon;
            document.getElementById('musicRes').innerText = `🎵 ${data.music}`;
            document.getElementById('dailyHoroscope').innerText = `"${data.phrase}"`;
            
            document.getElementById('tarotName').innerText = data.tarotName;
            document.getElementById('tarotMeaning').innerText = `"${data.tarotMeaning}"`;
            
            document.getElementById('greetingName').innerText = name.toUpperCase();

            document.getElementById('inputForm').style.display = 'none';
            document.getElementById('results').style.display = 'block';
        } catch (error) {
            alert("Los astros están desalineados. Error de conexión.");
            document.getElementById('loader').style.display = 'none';
        }
    }

    function downloadImage() {
        const captureZone = document.getElementById('captureZone');
        const btn = document.querySelector('.btn-social');
        btn.innerText = "⏳ Generando imagen...";
        html2canvas(captureZone, { backgroundColor: "#0a0a1a", scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'MiCartaCosmos.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.innerText = "✅ ¡Foto descargada!";
            setTimeout(() => { btn.innerText = "📸 Descargar Foto para Historia"; }, 3000);
        });
    }
</script>

</body>
</html>
